name: Bug report
description: Something does not work as described
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste** your session database, API token, QR codes, phone numbers or message contents. Security problems go through private reporting (Security › Report a vulnerability).
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and architecture
      placeholder: macOS 26.5 arm64 / Arch Linux x86-64 / Windows 11 x64
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: whatsapp-mcp version
      description: Output of `whatsapp-mcp version`
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: How do you use it?
      options: [Pi with pi-whatsapp, Another MCP client, Command line only]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `whatsapp-mcp logs`. Remove anything personal.
      render: text
